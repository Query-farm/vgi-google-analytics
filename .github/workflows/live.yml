name: Live

# The tiers that talk to real Google Analytics. They need a credential, spend
# Data API quota from the test property, and so run on a schedule (and on
# demand) rather than on every push.
#
# Repository configuration:
#   secrets.GA4_SERVICE_ACCOUNT_JSON  the JSON key of a service account that has
#                                     Viewer on the test property
#   vars.GA4_TEST_PROPERTY            numeric id of that property (optional; the
#                                     first readable property is used otherwise)
#
# Without the secret both jobs skip cleanly, so forks and fresh clones stay green.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  # Never two at once: they share the property's hourly token budget.
  group: ga4-live
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_NO_SOURCES: "1"

jobs:
  live:
    name: Live tests (real ATTACH against GA4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VGI_GA4_TEST_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      VGI_GA4_TEST_PROPERTY: ${{ vars.GA4_TEST_PROPERTY }}
    steps:
      - uses: actions/checkout@v5
        if: env.VGI_GA4_TEST_SERVICE_ACCOUNT_JSON != ''
      - uses: astral-sh/setup-uv@v6
        if: env.VGI_GA4_TEST_SERVICE_ACCOUNT_JSON != ''
        with:
          enable-cache: true
      - if: env.VGI_GA4_TEST_SERVICE_ACCOUNT_JSON != ''
        run: uv sync --no-sources --frozen
      - name: Live tests
        if: env.VGI_GA4_TEST_SERVICE_ACCOUNT_JSON != ''
        run: uv run --no-sources pytest -q -m live
      - name: Skipped — no credential configured
        if: env.VGI_GA4_TEST_SERVICE_ACCOUNT_JSON == ''
        run: echo "::notice::GA4_SERVICE_ACCOUNT_JSON is not set; live tests skipped."

  behavioural:
    name: vgi-lint (executes every example)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: live
    env:
      GA4_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
        if: env.GA4_KEY != ''
      - uses: astral-sh/setup-uv@v6
        if: env.GA4_KEY != ''
        with:
          enable-cache: true
      - if: env.GA4_KEY != ''
        run: uv sync --no-sources --frozen
      # vgi-lint attaches the worker without a DuckDB secret, so the worker
      # authenticates through Application Default Credentials: the key is written
      # to a file and GOOGLE_APPLICATION_CREDENTIALS points at it.
      - name: Write the service-account key for ADC
        if: env.GA4_KEY != ''
        run: |
          umask 077
          printf '%s' "$GA4_KEY" > "$RUNNER_TEMP/ga4-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4-key.json" >> "$GITHUB_ENV"
      - name: vgi-lint (structural + behavioural)
        if: env.GA4_KEY != ''
        run: >
          uvx --no-sources --from vgi-lint-check==0.82.0 vgi-lint lint "uv run --no-sources ga4_worker.py"
          --execute-concurrency 1 --no-check-links --audit-waivers --fail-on error
      - name: Remove the key
        if: always() && env.GA4_KEY != ''
        run: rm -f "$RUNNER_TEMP/ga4-key.json"
