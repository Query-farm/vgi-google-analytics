# vgi-lint configuration for the Google Analytics 4 worker.
#
#   vgi-lint lint --audit-waivers
#
# re-runs the rules these waivers silence and fails if one has stopped buying
# anything, so a waiver cannot outlive the reason it was granted.

location = "uv run --no-sources ga4_worker.py"
select = ["ALL"]
fail_on = "error"

ignore = [
  { code = "VGI311", kind = "tooling-bug", reason = """\
Every parameterless scan here IS exposed as a table: all_account_summaries backs \
`account_summaries`, all_accounts backs `accounts`, and all_properties backs \
`properties`. The rule looks for a table whose name matches the function's, so it \
cannot see the link. The names differ deliberately — a function and a table cannot \
share one name in a schema, so the scan takes the `all_` prefix and the table keeps \
the name consumers actually type.\
""" },
]

[per-object]
# One row per (account, property), plus one row with a NULL property for an
# account the credential can see but that holds no readable property. A primary
# key cannot contain NULL, so the identity is declared as UNIQUE (account_id,
# property_id) instead — which states exactly what is true.
"ga4.main.account_summaries" = { ignore = [
  { code = "VGI807", kind = "domain-exemption", reason = "identity is UNIQUE(account_id, property_id); property_id is NULL for an account with no readable property, so it cannot be a primary key" },
] }

# `accounts.account_id` is the table's own primary key, not a reference to
# another table; the rule matches the `<table>_id` shape without knowing that.
"ga4.main.accounts" = { ignore = [
  { code = "VGI808", kind = "tooling-bug", reason = "account_id is this table's own primary key, not a reference" },
] }
